name: Pruebas en Windows
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths: ["**.py", "tests/**", ".github/workflows/pruebas.yml"]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - name: Pruebas de funciones de Windows
        run: python tests/ci_windows.py
        env:
          PYTHONIOENCODING: utf-8
      - name: Captura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captura
          path: pantalla_ci.png
          if-no-files-found: ignore
