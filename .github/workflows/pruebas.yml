name: Pruebas en Windows
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths: ["**.py", "tests/**", ".github/workflows/pruebas.yml"]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow cryptography
      - name: Pruebas de funciones de Windows
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          python tests/ci_windows.py *> resultado.txt
          $code = $LASTEXITCODE
          $t = (Get-Content resultado.txt -Raw -Encoding utf8)
          if ($t.Length -gt 30000) { $t = $t.Substring(0, 30000) }
          $t = $t.Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
          Write-Output "::notice title=resultado::$t"
          $r = ((Select-String -Path resultado.txt -Pattern "^(PASS|FAIL|RESUMEN)").Line -join "`n").Replace('%','%25').Replace("`n",'%0A')
          Write-Output "::notice title=resumen::$r"
          exit $code
      - name: Captura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captura
          path: pantalla_ci.png
          if-no-files-found: ignore
