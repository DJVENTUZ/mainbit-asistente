name: Compilar Mainbit Asistente
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compilar
        shell: pwsh
        run: |
          python -m pip install --upgrade pyinstaller cryptography pywebview
          Set-Content -Encoding utf8 mb_build.py ('BUILD = "' + '${{ github.sha }}'.Substring(0,7) + ' ' + (Get-Date -Format 'dd-MMM HH:mm') + '"')
          python -m PyInstaller --noconfirm --clean --onedir --windowed --uac-admin --collect-all webview --collect-all pythonnet --collect-all clr_loader --hidden-import clr --add-data "web;web" --name MainbitAsistente mainbit_asistente.py
          $p = Start-Process -FilePath dist\MainbitAsistente\MainbitAsistente.exe -ArgumentList "--prueba-ui" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill() }
          $r = Get-Content dist\MainbitAsistente\uiprobe.txt -ErrorAction SilentlyContinue
          Write-Host "::notice title=PRUEBA UI::$r"
          if (-not $r -or $r -notmatch '"ok": true') { Write-Host "::error::La interfaz nueva no abrió bien: $r"; exit 1 }
          Remove-Item dist\MainbitAsistente\uiprobe.txt -ErrorAction SilentlyContinue
          foreach ($m in @("--prueba-hijo-sucio", "--prueba-hijo")) {
            $q = Start-Process -FilePath dist\MainbitAsistente\MainbitAsistente.exe -ArgumentList $m -PassThru
            if (-not $q.WaitForExit(200000)) { $q.Kill() }
            $r2 = Get-Content dist\MainbitAsistente\uiprobe.txt -ErrorAction SilentlyContinue
            Write-Host "::notice title=INSTANCIA HIJA ($m)::$r2"
            if ($m -eq "--prueba-hijo" -and (-not $r2 -or $r2 -notmatch '"ok": true')) { Write-Host "::error::La app abierta por otra copia de sí misma no abrió la interfaz nueva: $r2"; exit 1 }
            Remove-Item dist\MainbitAsistente\uiprobe.txt -ErrorAction SilentlyContinue
          }
          # Simula un equipo SIN .NET Core (como el del técnico): no debe impedir la interfaz nueva
          Remove-Item "$env:ProgramData\MainbitAsistente\arranque_error.txt" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path C:\sin_dotnet | Out-Null
          $env:DOTNET_ROOT = "C:\sin_dotnet"; $env:DOTNET_ROOT_X64 = "C:\sin_dotnet"; $env:DOTNET_MULTILEVEL_LOOKUP = "0"; $env:DOTNET_gcServer = "0"
          $env:DOTNET_ROOT_FORCE = "1"
          $w = Start-Process -FilePath dist\MainbitAsistente\MainbitAsistente.exe -ArgumentList "--prueba-ui","--sin-copia" -PassThru
          if (-not $w.WaitForExit(150000)) { $w.Kill() }
          $r3 = Get-Content dist\MainbitAsistente\uiprobe.txt -ErrorAction SilentlyContinue
          $e3 = Get-Content "$env:ProgramData\MainbitAsistente\arranque_error.txt" -Raw -ErrorAction SilentlyContinue
          Write-Host "::notice title=SIN .NET CORE::probe=$r3 || error=$e3"
          Remove-Item env:DOTNET_ROOT,env:DOTNET_ROOT_X64,env:DOTNET_MULTILEVEL_LOOKUP -ErrorAction SilentlyContinue
          Remove-Item dist\MainbitAsistente\uiprobe.txt -ErrorAction SilentlyContinue
          python -m pip install pillow
          $c = python tests\ci_cristal.py dist\MainbitAsistente\MainbitAsistente.exe E R@acrilico 2>&1 | Out-String
          Write-Host "::notice title=CRISTAL::$c"
          Copy-Item ABRIR_DESDE_USB.bat dist\MainbitAsistente\ABRIR_DESDE_USB.bat
          Compress-Archive -Path dist\MainbitAsistente -DestinationPath MainbitAsistente.zip -Force
      - name: Publicar release "latest"
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes 2>$null
          gh release create latest MainbitAsistente.zip --title "Ultima version" --notes "Compilado automatico $(Get-Date -Format s)" --target ${{ github.sha }}
